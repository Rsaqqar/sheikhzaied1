<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سباق الغواصات الذكية: رحلة الأعماق</title>
<style>
:root{--k:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(var(--k) * clamp(11px, 0.8vw + 0.9vh + 4px, 26px))}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:#04162f;color:#fff;direction:rtl;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}

/* ---------- الإعدادات ---------- */
#setup{overflow:auto;background:radial-gradient(circle at 50% 0,#1e88c9,#0a2d5e 55%,#04162f);justify-content:center;align-items:flex-start}
.sbox{width:min(62rem,100%);padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.sbox h1{margin:.2rem 0;text-align:center;font-size:1.9rem;text-shadow:0 2px 8px #0008}
.sbox .meta{text-align:center;margin:0;opacity:.9;font-size:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.card{background:rgba(3,18,46,.7);border:2px solid rgba(255,255,255,.25);border-radius:1rem;padding:.8rem}
.card h3{margin:0 0 .5rem;font-size:1.1rem}
.lbl{font-size:.85rem;margin:.5rem 0 .25rem;opacity:.9}
.card input[type=text],.card select{width:100%;font:inherit;font-size:1rem;padding:.5rem;border-radius:.6rem;border:2px solid #7fc8ff;background:#0b2a55;color:#fff}
.sw,.avs{display:flex;flex-wrap:wrap;gap:.4rem}
.sw button{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid #fff5;padding:0}
.sw button.sel{border-color:#fff;box-shadow:0 0 0 3px #fff6}
.avs button{font-size:1.5rem;padding:.2rem .5rem;border-radius:.7rem;border:2px solid #fff4;background:#0b2a55}
.avs button.sel{border-color:#ffd54a;background:#164a8a}
.avs button small{display:block;font-size:.55rem}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.fields label{display:block;font-size:.85rem}
.chk{display:flex;align-items:center;gap:.5rem;font-size:1rem;padding-top:1.1rem}
.chk input{width:1.4rem;height:1.4rem}
.btnbig{font-size:1.5rem;font-weight:bold;padding:.7rem 2rem;border-radius:1rem;border:3px solid #fff;background:linear-gradient(#ffd54a,#ff9800);color:#4a2500;box-shadow:0 4px 0 #a45a00;align-self:center}
.btnbig:active{transform:translateY(2px)}

/* ---------- اللعبة ---------- */
#game{flex-direction:column}
#hud{display:flex;align-items:center;justify-content:center;gap:.7rem;padding:.25rem .6rem;background:linear-gradient(#082a56,#0a3a73);border-bottom:2px solid rgba(255,255,255,.25);z-index:5}
#hud h1{margin:0;font-size:1.1rem;text-align:center}
.hb{width:2.4rem;height:2.4rem;font-size:1.2rem;border-radius:50%;border:2px solid #fff8;background:#0f4d8f;padding:0}
.hb.off{opacity:.5}
.timer{position:relative;width:3.2rem;height:3.2rem}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:rgba(0,0,0,.35);stroke-width:4}
.timer .trk{stroke:#ffffff33}
.timer .arc{stroke:#5ff0ff;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:0;fill:none}
.timer.low .arc{stroke:#ff5d5d}
.timer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.05rem}
#teams{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;min-height:0;background:#ffffff55}
.team{--sh:2.6rem;--ch:2.3rem;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;overflow:hidden;background:linear-gradient(#69d4f7,#1a78c2 35%,#0b2e63 70%,#06142e);border-top:5px solid var(--c)}
.th{display:flex;align-items:center;gap:.5rem;padding:.3rem .5rem;background:rgba(3,15,40,.78);flex-wrap:wrap}
.th .av{font-size:1.6rem;line-height:1}
.th .tn{font-weight:bold;font-size:1.1rem;color:var(--c);flex:1;min-width:6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;gap:.6rem;font-weight:bold;font-size:.95rem}
.stats .ok{color:#7dffb0}.stats .bad{color:#ff9a9a}.stats .tm{color:#ffe28a}
.prog{display:flex;gap:3px;padding:.25rem .5rem;background:rgba(3,15,40,.55)}
.prog i{flex:1;height:.55rem;border-radius:.3rem;background:#ffffff33}
.prog i.ok{background:#2ee88a}.prog i.bad{background:#ff6a6a}.prog i.cur{background:#ffd54a;box-shadow:0 0 6px #ffd54a}
.mainrow{flex:1;display:flex;gap:.5rem;min-height:0;padding:.4rem}
.lw{display:flex;gap:.25rem;flex:none;width:clamp(7rem,32%,11rem)}
.scale{position:relative;width:2.6rem;flex:none}
.sl{position:absolute;inset-inline:0;top:calc((100% - var(--sh) - var(--ch))*var(--i)/7 + var(--sh)/2);transform:translateY(-50%);font-size:.62rem;text-align:center;background:rgba(3,15,40,.7);border-radius:.4rem;padding:.1rem 0}
.sl.here{background:var(--c);color:#04162f;font-weight:bold}
.lane{position:relative;flex:1;border-radius:.8rem;overflow:hidden;border:2px solid rgba(255,255,255,.4);background:linear-gradient(#b4ecff,#3a9fe0 30%,#14407f 65%,#050f27)}
.mk{position:absolute;inset-inline:0;top:calc((100% - var(--sh) - var(--ch))*var(--i)/7 + var(--sh)/2);border-top:1px dashed rgba(255,255,255,.3)}
.bub{position:absolute;bottom:-1rem;width:.5rem;height:.5rem;border-radius:50%;border:1.5px solid #ffffffaa;animation:rise var(--d) linear infinite;animation-delay:var(--w)}
.weed{position:absolute;bottom:0;width:1.6rem;height:2.6rem;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
.sub{position:absolute;left:50%;width:4.2rem;height:var(--sh);transform:translateX(-50%);top:calc((100% - var(--sh) - var(--ch))*var(--d)/7);transition:top 2.8s cubic-bezier(.45,.05,.3,1);z-index:3}
.subin{position:relative;width:100%;height:100%}
.sub svg{width:100%;height:100%;display:block;overflow:visible}
.bodyc{fill:var(--c)}
.beam{position:absolute;top:75%;left:50%;width:3.6rem;height:calc(var(--sh)*1.7);transform:translateX(-50%);background:linear-gradient(rgba(255,244,160,.65),transparent);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);animation:flick 2.4s ease-in-out infinite;pointer-events:none}
.sonar{position:absolute;left:50%;top:50%;width:2.2rem;height:2.2rem;margin:-1.1rem;border-radius:50%;border:2px solid rgba(255,255,255,.8);opacity:0;pointer-events:none}
.diving .sonar{animation:ping 1.2s ease-out infinite}
.diving .sonar:nth-of-type(2){animation-delay:.6s}
.shake .subin{animation:shk .5s}
.chest{position:absolute;bottom:.1rem;left:50%;width:3.2rem;height:var(--ch);transform:translateX(-50%);z-index:2}
.chest svg{width:100%;height:100%;overflow:visible}
.chest .glow{fill:var(--c);opacity:0;transition:opacity .8s}
.chest .gold{opacity:0;transition:opacity .6s}
.chest .lid{transform-origin:8px 22px;transition:transform .8s}
.chest.open .glow{opacity:.55}
.chest.open .gold{opacity:1}
.chest.open .lid{transform:rotate(-40deg)}
.chest:not(.open) .glow{animation:none}
.lane.glowing{box-shadow:0 0 18px 4px var(--c)}
.qpanel{flex:1;min-width:0;display:flex;flex-direction:column;gap:.4rem;background:rgba(3,15,40,.75);border-radius:.8rem;padding:.5rem;overflow-y:auto;overflow-x:hidden}
.qinfo{display:flex;justify-content:space-between;gap:.4rem;font-size:.85rem;flex-wrap:wrap}
.qinfo .dp{color:#ffe28a;font-weight:bold}
.streak{color:#7dfcff;font-weight:bold;min-height:1.1rem;font-size:.9rem}
.qtype{align-self:flex-start;font-size:.75rem;background:var(--c);color:#04162f;font-weight:bold;border-radius:1rem;padding:.1rem .6rem}
.qtext{font-size:1.2rem;font-weight:bold;line-height:1.6}
.g-low .qtext{font-size:1.5rem}.g-low .opt{font-size:1.25rem}
.opts{display:grid;gap:.45rem;grid-auto-rows:minmax(3rem,auto)}
.opts.tf,.opts.sym{grid-template-columns:1fr 1fr}
.opt{font-size:1.05rem;font-weight:bold;line-height:1.5;padding:.45rem .6rem;border-radius:.8rem;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.13);text-align:center;touch-action:manipulation}
.opt:not(:disabled):active{background:rgba(255,255,255,.3)}
.opt .big{font-size:2.3rem;line-height:1.3}
.opt.ok{background:#14a35c;border-color:#8dffc0}
.opt.no{background:#c93636;border-color:#ffabab}
.opt.dim{opacity:.45}
.fb{font-size:1rem;font-weight:bold;min-height:1.4rem;line-height:1.5}
.fb.ok{color:#7dffb0}.fb.no{color:#ffb0b0}
.fb small{display:block;font-weight:normal;color:#e6f4ff;font-size:.85rem}
.doneBox{text-align:center;padding:.5rem}
.doneBox .em{font-size:3rem}

/* ---------- الطبقات ---------- */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,10,30,.85);z-index:50;padding:1rem;overflow:auto}
.ov.on{display:flex}
.panel{background:linear-gradient(#0c3a72,#071d40);border:3px solid #7fc8ff;border-radius:1.2rem;padding:1rem 1.2rem;text-align:center;max-width:46rem;width:100%}
.panel h2{margin:.2rem 0 .6rem;font-size:1.7rem}
.btns{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.6rem}
.btn{font-size:1.1rem;font-weight:bold;padding:.55rem 1.1rem;border-radius:.9rem;border:2px solid #fff9;background:#14589f}
.btn.pri{background:linear-gradient(#ffd54a,#ff9800);color:#4a2500;border-color:#fff}
.banner{font-size:1.8rem;font-weight:bold;color:#ffe28a;margin:.2rem 0}
.why{font-size:1rem;margin-bottom:.6rem;opacity:.95}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;text-align:right}
.rc{background:rgba(255,255,255,.08);border:3px solid var(--c);border-radius:1rem;padding:.6rem}
.rc.win{background:rgba(255,213,74,.18);box-shadow:0 0 18px var(--c)}
.rc h3{margin:0 0 .4rem;color:var(--c);font-size:1.15rem}
.rc div{font-size:.95rem;padding:.12rem 0;display:flex;justify-content:space-between;gap:.5rem}
.rc .bd{display:block;font-size:.85rem;color:#ffe28a;padding-top:.3rem}

@keyframes rise{from{transform:translateY(0);opacity:.8}to{transform:translateY(-120vh);opacity:.1}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes flick{0%,100%{opacity:.55}50%{opacity:.85}}
@keyframes ping{0%{transform:scale(.3);opacity:.7}100%{transform:scale(2.3);opacity:0}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
body.paused *{animation-play-state:paused!important}
body.reduce .bub{display:none}
body.reduce .weed,body.reduce .beam,body.reduce .sonar{animation:none!important}
body.reduce .shake .subin{animation:none}

@media (max-width:760px) and (orientation:portrait){
 #teams{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
 .grid2,.fields,.rgrid{grid-template-columns:1fr}
 #hud h1{display:none}
 .lw{width:clamp(6.2rem,30%,8rem)}
 .team{--sh:2.2rem;--ch:2rem}.sub{width:3.4rem}
}
@media (max-width:560px){.grid2,.fields,.rgrid{grid-template-columns:1fr}}
</style>
</head>
<body class="dev-pc g-high">

<!-- شاشة إعدادات المعلم -->
<div id="setup" class="screen on">
 <div class="sbox">
  <h1>🔱 سباق الغواصات الذكية: رحلة الأعماق</h1>
  <p class="meta">المادة: الدراسات الاجتماعية · الدرس: الرؤية الأولى — الشيخ زايد –رحمه الله– بطل تحويل الفكر الاتحادي إلى واقع</p>
  <div class="grid2" id="teamCards"></div>
  <div class="card">
   <h3>⚙️ إعدادات الجولة</h3>
   <div class="fields">
    <label>نوع الجهاز
     <select id="selDevice"><option value="board">سبورة ذكية</option><option value="pc">حاسوب</option><option value="tablet">جهاز لوحي</option><option value="phone">هاتف</option></select></label>
    <label>مستوى الصف
     <select id="selGrade"><option value="g1-4">الصفوف 1 – 4 (3 خيارات، خط أكبر)</option><option value="g5-8">الصفوف 5 – 8</option><option value="g9-12" selected>الصفوف 9 – 12</option></select></label>
    <label>مستوى الصعوبة
     <select id="selDiff"><option value="easy">سهل (3 خيارات، من الأسهل)</option><option value="mid">متوسط (ترتيب ثابت)</option><option value="graded" selected>متدرج (من الأسهل للأصعب)</option></select></label>
    <label>مدة الجولة
     <select id="selDur"><option value="60">60 ثانية</option><option value="90" selected>90 ثانية</option><option value="120">120 ثانية</option><option value="150">150 ثانية</option></select></label>
    <label class="chk"><input type="checkbox" id="chkSound" checked> تشغيل الصوت</label>
    <label class="chk"><input type="checkbox" id="chkReduce"> تقليل الحركة</label>
   </div>
  </div>
  <button id="btnStart" class="btnbig" type="button">🚀 تجهيز الجولة</button>
 </div>
</div>

<!-- شاشة اللعب -->
<div id="game" class="screen">
 <div id="hud">
  <button class="hb" id="btnPause" type="button" title="إيقاف مؤقت">⏸</button>
  <div class="timer" id="timer"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="19" style="fill:none"/><circle class="arc" id="arc" cx="22" cy="22" r="19"/></svg><span id="timeNum">90</span></div>
  <h1>🔱 سباق الغواصات الذكية: رحلة الأعماق</h1>
  <button class="hb" id="btnSound" type="button" title="الصوت">🔊</button>
  <button class="hb" id="btnMotion" type="button" title="تقليل الحركة">🌊</button>
 </div>
 <div id="teams"></div>

 <div class="ov on" id="ovReady"><div class="panel">
  <h2>🌊 هل أنتم مستعدون للغوص؟</h2>
  <p id="readyInfo" style="font-size:1.1rem"></p>
  <div class="btns"><button class="btn pri" id="btnBegin" type="button" style="font-size:1.6rem">ابدأ الغوص!</button><button class="btn" id="btnReadyBack" type="button">العودة للبداية</button></div>
 </div></div>

 <div class="ov" id="ovPause"><div class="panel">
  <h2>⏸ توقّف مؤقت</h2>
  <div class="btns">
   <button class="btn pri" id="pResume" type="button">▶ متابعة</button>
   <button class="btn" id="pRestart" type="button">🔄 إعادة الجولة</button>
   <button class="btn" id="pSound" type="button">🔊 الصوت</button>
   <button class="btn" id="pMotion" type="button">🌊 تقليل الحركة</button>
   <button class="btn" id="pHome" type="button">🏠 العودة للبداية</button>
  </div>
 </div></div>

 <div class="ov" id="ovResults"><div class="panel">
  <h2>🏁 نتائج رحلة الأعماق</h2>
  <div class="banner" id="rBanner"></div>
  <div class="why" id="rWhy"></div>
  <div class="rgrid" id="rGrid"></div>
  <div class="btns"><button class="btn pri" id="rAgain" type="button">🔄 إعادة اللعب</button><button class="btn" id="rHome" type="button">🏠 العودة للبداية</button></div>
 </div></div>
</div>

<script>
'use strict';
(function () {
  var QN = 7, DIVE_MS = 2800, WRONG_MS = 2600;
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

  /* ================= بيانات الدرس: الرؤية الأولى (من الملف المرفق فقط) ================= */
  // كل خيار: [النص, 1 إذا كان صحيحًا]
  var QSETS = {
    1: [
      { id: 'A1', type: 'mcq', level: 1, text: 'ما عنوان الرؤية الأولى في هذا الدرس؟',

        expl: 'عنوان الرؤية الأولى: الشيخ زايد بطل تحويل الفكر الاتحادي إلى واقع.' },
      { id: 'A2', type: 'tf', level: 1, noShuffle: 1, text: 'تسلّم الشيخ زايد –رحمه الله– مقاليد الحكم في أبوظبي عام 1966م.',
        options: [['صح ✔', 1], ['خطأ ✖', 0]], expl: 'نعم، كان ذلك عام 1966م وعدّه فرصة لترجمة مبادئه إلى خطوات عملية.' },
      { id: 'A3', type: 'fill', level: 2, text: 'اعتبر الشيخ زايد تسلّمه الحكم فرصة لترجمة مبادئه إلى ........ عملية.',
        options: [['خطوات', 1], ['شعارات', 0], ['وعود', 0], ['أمنيات', 0]], expl: 'ترجمة المبادئ إلى «خطوات عملية» في تنفيذ رؤيته للوحدة والتنمية.' },
      { id: 'A4', type: 'cls', level: 1, text: 'تُصنَّف قيمة «التحفيز» ضمن:',

      { id: 'A6', type: 'ord', level: 3, text: 'رتّب مسار رؤية الشيخ زايد كما ورد في «وسّع معرفتك»:',
        options: [['تسلّم الحكم عام 1966م ثم مشروعات تغيّر ملامح أبوظبي ثم حلم وحدة الإمارات ثم جني الجميع ثمار التطور', 1], ['مشروعات تغيّر ملامح أبوظبي ثم تسلّم الحكم ثم جني ثمار التطور ثم حلم وحدة الإمارات', 0], ['حلم وحدة الإمارات ثم تسلّم الحكم ثم جني ثمار التطور ثم المشروعات', 0], ['جني ثمار التطور ثم حلم الوحدة ثم المشروعات ثم تسلّم الحكم', 0]],
        expl: 'بدأ بتسلّم الحكم، ثم المشروعات، وكان ذلك مقدمة لحلم الوحدة ليجني الجميع ثمار التطور.' },
      { id: 'A7', type: 'app', level: 3, text: 'شارك طالب في احتفال اليوم الوطني ورفع العلم بفخر. أي قيمتين يعبّر عنهما سلوكه؟',

    ],
    2: [
      { id: 'B1', type: 'mcq', level: 1, text: 'ما الفكرة الرئيسة للرؤية الأولى؟',
        options: [['ثمار الفكر الاتحادي تحوّلت إلى إنجازات باهرة ونهضة حديثة', 1], ['الاتحاد لم يغيّر شيئًا في الدولة', 0], ['النهضة بدأت دون فكر اتحادي', 0], ['ذكر الشيخ زايد سيزول مع الزمن', 0]],
        expl: 'تحوّلت ثمار الفكر الاتحادي إلى إنجازات، وسيبقى ذكر الشيخ زايد خالدًا.' },
      { id: 'B2', type: 'tf', level: 1, noShuffle: 1, text: 'اعتبر الشيخ زايد منصبه تتويجًا لحياته السياسية وليس منطلقًا لخدمة الأهالي.',

  function renderDone(id, timeout) {
    var t = T(id), e = E[id], completed = t.answeredCount >= QN;
    e.qtype.textContent = completed ? '🏁 اكتملت الرحلة' : '⏰ انتهى الوقت';
    e.qtext.textContent = completed ? 'اكتمل تحدي الأعماق!' : 'انتهى الوقت قبل إنجاز كل الأسئلة';
    e.opts.className = 'opts'; e.opts.innerHTML = '';
    e.fb.className = 'fb ok'; e.fb.textContent = 'صحيح: ' + t.correctCount + ' من ' + QN + (completed && t.completionTime !== null ? ' · الزمن: ' + fmt(t.completionTime) : '');
    updateTeamUI(id);
  }
  function updateTeamUI(id) {
    var t = T(id), e = E[id];
    e.ok.textContent = t.correctCount; e.bad.textContent = t.wrongCount;
    e.dp.textContent = 'العمق: ' + (t.currentDepth * 100) + ' م';
    e.qn.textContent = t.finished || t.answeredCount >= QN ? 'أُنجزت ' + QN + ' من ' + QN : 'السؤال ' + (t.answeredCount + 1) + ' من ' + QN;
    e.segs.forEach(function (s, i) {
      s.className = i < t.results.length ? (t.results[i] ? 'ok' : 'bad') : (i === t.results.length && !t.finished ? 'cur' : '');
    });
    e.sls.forEach(function (s) { s.classList.toggle('here', parseInt(s.getAttribute('data-i'), 10) === t.currentDepth); });
    e.streak.textContent = t.streak >= 2 ? '🌊 تيار سريع ×' + t.streak : '';
    e.tm.textContent = Math.floor((t.completionTime !== null ? t.completionTime : elapsed) / 1000) + ' ث';
  }
  function checkGameEnd() {
    if (gameState === 'RUNNING' && team1State.finished && team2State.finished) later(1600, finishGame);
  }
  function computeBadges(t) {
    t.badges = [];
    if (t.currentDepth >= QN) t.badges.push('🏆 كنز مفتوح');
    if (t.maxStreak >= 2) t.badges.push('🌊 تيار سريع ×' + t.maxStreak);
    if (t.answeredCount >= QN && t.completionTime !== null && t.completionTime <= durMs() * 0.65) t.badges.push('⚡ غوص قياسي');
  }
  function timeUsed(t) { return t.completionTime !== null ? t.completionTime : durMs(); }
  function decideWinner() {
    var a = team1State, b = team2State, A = cfg.teams[1].name, B = cfg.teams[2].name;
    if (a.correctCount !== b.correctCount) {
      var w = a.correctCount > b.correctCount ? 1 : 2;
      return { w: w, why: 'السبب: الأعلى في عدد الإجابات الصحيحة (الأعمق غوصًا)' };
    }
    if (a.correctCount > 0 && a.lastCorrectAt !== b.lastCorrectAt) {
      return { w: a.lastCorrectAt < b.lastCorrectAt ? 1 : 2, why: 'السبب: التعادل في الإجابات الصحيحة، وفاز الأسرع في الوصول إلى العمق' };
    }
    if (timeUsed(a) !== timeUsed(b)) {
      return { w: timeUsed(a) < timeUsed(b) ? 1 : 2, why: 'السبب: التعادل في الإجابات الصحيحة، وفاز الأقل زمنًا في إنجاز التحدي' };
    }
    return { w: 0, why: 'تعادل كامل في الإجابات الصحيحة والزمن بين ' + A + ' و' + B };
  }
  function finishGame() {
    if (gameState === 'FINISHED') return;
    gameState = 'FINISHED'; tasks = [];
    $('#btnPause').disabled = true;
    [1, 2].forEach(function (id) {
      var t = T(id), e = E[id], wasDone = t.finished;
      t.finished = true; t.answerLocked = true; t.isAnimating = false;
      t.currentDepth = t.correctCount;
      e.sub.classList.remove('diving', 'shake');
      e.sub.style.setProperty('--d', t.currentDepth);
      if (t.currentDepth >= QN) { e.chest.classList.add('open'); e.lane.classList.add('glowing'); }
      $$('.opt', e.opts).forEach(function (b) { b.disabled = true; });
      if (!wasDone) renderDone(id, true);
      computeBadges(t); updateTeamUI(id);
    });
    var res = decideWinner();
    sfx(res.w ? 'win' : 'end');
    showResults(res);
  }
  function showResults(res) {
    var banner = $('#rBanner');
    banner.textContent = res.w ? '🏆 الفائز: ' + cfg.teams[res.w].name : '🤝 تعادل!';
    $('#rWhy').textContent = res.why;
    var grid = $('#rGrid'); grid.innerHTML = '';
    [1, 2].forEach(function (id) {
      var t = T(id), c = cfg.teams[id], card = document.createElement('div');
      card.className = 'rc' + (res.w === id ? ' win' : '');
      card.style.setProperty('--c', COLORS[c.color].v);
      var h = document.createElement('h3'); h.textContent = AVATARS[c.avatar].e + ' ' + c.name; card.appendChild(h);
      [['الإجابات الصحيحة', t.correctCount], ['الأخطاء', t.wrongCount], ['الأسئلة المنجزة', t.answeredCount + ' من ' + QN],
       ['العمق المكتشف', (t.currentDepth * 100) + ' م'], ['الزمن المستغرق', t.completionTime !== null ? fmt(t.completionTime) : 'انتهى الوقت (' + cfg.duration + ' ث)']].forEach(function (r) {
        var d = document.createElement('div'), l = document.createElement('span'), v = document.createElement('b');
        l.textContent = r[0]; v.textContent = r[1]; d.appendChild(l); d.appendChild(v); card.appendChild(d);
      });
      var bd = document.createElement('span'); bd.className = 'bd'; bd.textContent = 'الشارات: ' + (t.badges.length ? t.badges.join(' · ') : 'لا توجد'); card.appendChild(bd);
      grid.appendChild(card);
    });
    $('#ovResults').classList.add('on');
  }

  /* ================= تحكم الجولة ================= */
  function resetGame() {
    clearAllTimers();                      // تصفير نظيف للمؤقتات والمهام
    elapsed = 0; lastSec = -1; gameState = 'START';
    team1State = makeTeamState(1); team2State = makeTeamState(2);
    document.body.classList.remove('paused');
    $('#btnPause').disabled = false;
    [1, 2].forEach(function (id) {
      var e = E[id];
      applyTeamLook(id);
      e.sub.classList.remove('diving', 'shake'); e.sub.style.setProperty('--d', 0);
      e.chest.classList.remove('open'); e.lane.classList.remove('glowing');
      renderTeamQuestion(id);
    });
    updateClocks();
    $('#timeNum').textContent = cfg.duration; $('#arc').style.strokeDashoffset = '0'; $('#timer').classList.remove('low');
    $('#ovPause').classList.remove('on'); $('#ovResults').classList.remove('on');
    $('#readyInfo').textContent = cfg.teams[1].name + ' ضد ' + cfg.teams[2].name + ' — ' + QN + ' أسئلة لكل فريق خلال ' + cfg.duration + ' ثانية';
    $('#ovReady').classList.add('on');
    startTicker();
  }
  function beginRound() {
    if (gameState !== 'START') return;
    ensureAudio();
    $('#ovReady').classList.remove('on');
    gameState = 'RUNNING'; lastTs = performance.now();
    sfx('arrive');
  }
  function pauseGame() {
    if (gameState !== 'RUNNING') return;
    gameState = 'PAUSED'; document.body.classList.add('paused');
    syncToggles(); $('#ovPause').classList.add('on');
  }
  function resumeGame() {
    if (gameState !== 'PAUSED') return;
    $('#ovPause').classList.remove('on'); document.body.classList.remove('paused');
    gameState = 'RUNNING'; lastTs = performance.now();
  }
  function backToSetup() {
    clearAllTimers(); gameState = 'START';
    document.body.classList.remove('paused');
    ['ovReady', 'ovPause', 'ovResults'].forEach(function (i) { $('#' + i).classList.remove('on'); });
    $('#game').classList.remove('on'); $('#setup').classList.add('on');
    refreshSetup();
  }
  function startFromSetup() {
    [1, 2].forEach(function (id) { var n = (cfg.teams[id].name || '').trim(); cfg.teams[id].name = n || DEF_NAMES[id]; $('[data-name="' + id + '"]').value = cfg.teams[id].name; });
    applyDevice(); syncToggles();
    $('#setup').classList.remove('on'); $('#game').classList.add('on');
    ensureAudio();
    resetGame();
  }

  function initGame() {
    if (bound) return; bound = true;       // يمنع تضاعف المستمعات
    buildTeamDOM(1); buildTeamDOM(2); buildSetup();
    var w = window.innerWidth; cfg.device = w < 700 ? 'phone' : w < 1100 ? 'tablet' : 'pc';
    $('#selDevice').value = cfg.device; $('#chkReduce').checked = cfg.reduce;
    applyDevice(); syncToggles();
    $('#selDevice').addEventListener('change', function (e) { cfg.device = e.target.value; applyDevice(); });
    $('#selGrade').addEventListener('change', function (e) { cfg.grade = e.target.value; applyDevice(); });
    $('#selDiff').addEventListener('change', function (e) { cfg.difficulty = e.target.value; });
    $('#selDur').addEventListener('change', function (e) { cfg.duration = parseInt(e.target.value, 10) || 90; });
    $('#chkSound').addEventListener('change', function (e) { cfg.sound = e.target.checked; syncToggles(); });
    $('#chkReduce').addEventListener('change', function (e) { cfg.reduce = e.target.checked; syncToggles(); });
    $('#btnStart').addEventListener('click', startFromSetup);
    $('#btnBegin').addEventListener('click', beginRound);
    $('#btnReadyBack').addEventListener('click', backToSetup);
    $('#btnPause').addEventListener('click', pauseGame);
    $('#btnSound').addEventListener('click', toggleSound);
    $('#btnMotion').addEventListener('click', toggleMotion);
    $('#pResume').addEventListener('click', resumeGame);
    $('#pRestart').addEventListener('click', resetGame);
    $('#pSound').addEventListener('click', toggleSound);
    $('#pMotion').addEventListener('click', toggleMotion);
    $('#pHome').addEventListener('click', backToSetup);
    $('#rAgain').addEventListener('click', resetGame);
    $('#rHome').addEventListener('click', backToSetup);
    document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });
  }
  initGame();
})();
</script>
</body>
</html>
